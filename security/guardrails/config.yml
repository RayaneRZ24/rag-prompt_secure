# Configuration NeMo Guardrails v0.23.0
# Connecté à Llama 3.1 8B via l'API OpenAI-compatible d'Ollama

models:
  - type: main
    engine: openai
    model: llama3.1:8b
    parameters:
      base_url: "http://localhost:11434/v1"
      api_key: "ollama"

rails:
  input:
    flows:
      - block hacking instructions
      - block illegal content
      - block jailbreak attempts

instructions:
  - type: general
    content: |
      Tu es un assistant expert en sécurité informatique.
      Tu réponds aux questions sur : la cybersécurité, la protection des données,
      le RGPD, la gestion des incidents, les bonnes pratiques de sécurité,
      ainsi que les sujets généraux (sport, actualités, etc.).
      Tu refuses uniquement les demandes de hacking offensif, de contenu illégal
      ou de manipulation du système.
      Ne mentionne jamais le nom d'une organisation spécifique.
